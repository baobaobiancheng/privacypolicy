stages: [verify]

verify:
  stage: verify
  image: node:22-bookworm
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_DATABASE: privacy_policy_ci
    MYSQL_ROOT_PASSWORD: ci_password
    DATABASE_URL: mysql://root:ci_password@mysql:3306/privacy_policy_ci
    TEST_DATABASE_URL: mysql://root:ci_password@mysql:3306/privacy_policy_ci
    RUN_MYSQL_INTEGRATION: "1"
    NEXT_PUBLIC_DEV_FORM_DEFAULTS: "true"
  before_script:
    - npm ci
    - >-
      node -e 'const mariadb=require("mariadb"); let attempts=0;
      (async function wait(){try{const connection=await mariadb.createConnection({host:"mysql",user:"root",password:"ci_password"});
      await connection.end(); process.exit(0)}catch(error){if(++attempts>=30){console.error(error);process.exit(1)}
      setTimeout(wait,1000)}})()'
    - npm run db:generate
    - npm run db:migrate:deploy
  script:
    - npm run lint
    - npm run typecheck
    - RUN_MYSQL_INTEGRATION=0 npm test
    - npm run test:integration
    - npm run db:validate
    - npm run build
    - npm audit --omit=dev
